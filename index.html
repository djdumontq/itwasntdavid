<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>David Dumont | Brand &amp; Digital Sovereignty Consultant</title>
    <meta name="description" content="Brand consultant helping leaders design honest strategies, write compelling stories, and deploy self-hosted digital infrastructure." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://itwasntdavid.de" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://itwasntdavid.de" />
    <meta property="og:title" content="David Dumont | Brand &amp; Digital Sovereignty Consultant" />
    <meta property="og:description" content="Brand consultant helping leaders design honest strategies, write compelling stories, and deploy self-hosted digital infrastructure." />
    <meta property="og:image" content="https://itwasntdavid.de/images/profile-small.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://itwasntdavid.de" />
    <meta property="twitter:title" content="David Dumont | Brand &amp; Digital Sovereignty Consultant" />
    <meta property="twitter:description" content="Brand consultant helping leaders design honest strategies, write compelling stories, and deploy self-hosted digital infrastructure." />
    <meta property="twitter:image" content="https://itwasntdavid.de/images/profile-small.png" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- SVG Filter for Noisy/Rough Font Edges -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none; overflow: hidden;" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="noisy-edge">
          <!-- Generate slightly wider noise pattern -->
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          
          <!-- Displace the source graphic to create the rough edges/bleed outline -->
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="displacedSource" />
          
          <!-- Merge the crisp original SourceGraphic on top of the displaced noisy background -->
          <feMerge>
            <feMergeNode in="displacedSource" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
